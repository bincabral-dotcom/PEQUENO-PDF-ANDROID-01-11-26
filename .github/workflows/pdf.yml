name: Gerar APK Android

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK de teste
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          settings_file="$(find "$GITHUB_WORKSPACE" -name settings.gradle.kts -print -quit)"
          test -n "$settings_file" || { echo "settings.gradle.kts não encontrado."; exit 1; }
          echo "dir=$(dirname "$settings_file")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: gradle -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PEQUENO-PDF-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 30
