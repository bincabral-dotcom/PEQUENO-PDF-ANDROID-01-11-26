name: Gerar APK Android

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK de teste
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Preparar projeto Android
        id: project
        shell: bash
        run: |
          settings_file="$(find "$GITHUB_WORKSPACE" -name settings.gradle.kts -print -quit)"
          if [ -z "$settings_file" ]; then
            archive="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [ -n "$archive" ]; then
              mkdir -p "$GITHUB_WORKSPACE/.pequeno-pdf-source"
              unzip -q "$archive" -d "$GITHUB_WORKSPACE/.pequeno-pdf-source"
              settings_file="$(find "$GITHUB_WORKSPACE/.pequeno-pdf-source" -name settings.gradle.kts -print -quit)"
            fi
          fi
          test -n "$settings_file" || { echo "settings.gradle.kts não encontrado."; exit 1; }
          project_dir="$(dirname "$settings_file")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "apk=$project_dir/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: gradle -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PEQUENO-PDF-debug
          path: "${{ steps.project.outputs.apk }}"
          if-no-files-found: error
          retention-days: 30
